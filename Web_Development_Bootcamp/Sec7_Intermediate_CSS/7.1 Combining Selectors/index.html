<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Combining CSS Selectors</title>
  <link rel="stylesheet" href="./style.css">
</head>

<!-- Don't change any of the HTML code! -->

<!--
  There are Four ways of combining CSS selectors:
  
    1. Group 
       - Apply styles to multiple elements at once
       - Selectors are separated by a comma.

       Format:
       Selector, Selector {
         color: blueviolet;
         /* Other styles */
    
       }
    
    2. Child
       - Apply to DIRECT child of Left side selector (i.e. exactly 1 level inside the parent)
       - Use the right angle bracket'>' to select the direct child of a parent element.

       Format:
       Selector > Selector {
         color: firebrick;
       }

    3. Descendent
       - Apply to the descendent of Left side (called ancestor element).
       - Selectors are separated by a space.

       Format:
       Selector Selector {
         color: blue;
       }

    4. Chaining
       - Apply where ALL Selectors are true for the same element
       - The selectors to be chained are written together WITHOUT a space.
       
       Eg. h1#title.big.heading {} -> Refers to a h1 element with id "title" haiving two classes "big", "heading"

       Format:
       SelectorSelector {
         color: seagreen;
       }
-->

<body>
  <h1>To Do List</h1>
  <h2>Monday</h2>
  <div class="box">
    <p class="done">Do these things today!</p>
    <ul class="list">
      <li>Wash Clothes</li>
      <li class="done">Read</li>
      <li class="done">Maths Questions</li>
    </ul>
  </div>

  <ul>
    <p class="done">Other items</p>
  </ul>
  <p>The best preparation for tomorrow is doing your best today.</p>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Flag Project</title>
  <style>
    /* Write your CSS Code here */

    /* Red outer rectangle */
    .flag {
      background-color: rgb(206, 17, 38);
      width: 900px;
      height: 600px;
      position: relative;
    }

    /* Blue inner rectangle */
    .flag > div {
      background-color: rgb(0, 40, 104);
      width: 100%;  /* or 900px; */
      height: 300px;
      position: absolute;
      top: 150px;
    }

    p {
      color: white;
      font-size: 5rem;
      text-align: center;
      /* padding: 0; */
      margin: 0;
    }
    
    /* .flag > div div */
    .flag > div > div {
      background-color: white;
      height: 200px;
      width: 200px;
      border-radius: 50%;

      /* position: absolute; */
      position: relative;
      top: 50px;  /* Reason: height of circle = 200px, height of blue rectangle = 300px. So that leaves 300 - 200 = 100px of space. Since the white circle should be centered inside the blue rectangle, this leaves 50px of space on top of the white circle. */
      left: 350px;  /* width of circle = 200px, width of blue rectangle = 900px. This leaves 900 - 200 = 700px of space. To center the white circle inside the blue rectangle, we should position the circle 350px from the left corner of the blue rectangle. */
    }

    /* .flag > div div p OR .flag > div > div p */
    /* or .flag div div p */
    .flag > div > div > p {
      color: black;
    }
  </style>
</head>

<!-- 
  IMPORTANT! Do not change any HTML
Don't add any classes/ids/elements 
Use what you know about combining selectors 
and CSS specificity instead.
Hint 1: The flag is 900px by 600px and the circle is 200px by 200px.
Hint 2: You can use CSS inspection to get the colors from
https://appbrewery.github.io/flag-of-laos/
-->

<body>
  <div class="flag">
    <p>The Flag</p>
    <div>
      <div>
        <p>of Laos</p>
      </div>
    </div>
  </div>
</body>

</html>

<!DOCTYPE html>
<html>

<head>
  <title>Chessboard</title>
  <style>
    /* Write your code here */
    /* Each square should be 100px by 100px */
    /* My colours for white: #f0d9b5, black: #b58863 */
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
      /* To remove the gap between columns in bigger screens, you need to specific the correct width for the container */
      width: 800px; 
    }

    /*
      Note: The reason we see a gap between each of the columns on a big screen is because the div
      container tries to occupy the entire width of the screen by default. So, we need to specify the container's width
      (in this case, 800px) in order to get the desired chessboard look.

      The default behaviour of a div is to take up as much width as the screen, 
      but it only takes as much as height as it needs to fit all its content. 
      
      So, we don't need to set the container's height here to get the compact chessboard. Setting the width to 800px is enough.
    */

    .white {
      background-color: #f0d9b5;
    }

    .black {
      background-color: #b58863;
    }

    .white, .black {
      width: 100px;
      height: 100px;
    }
  </style>
</head>

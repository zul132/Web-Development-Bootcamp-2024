<!--
  There are 3 common values of the Display property - Block, Inline & Inline-Block.

  Note: the Display property actually has many different possible values, but these 3 are the most commonly used.

  - By default, most elements have a display value of block.
  - <span> element is usually used inside other elements like <p>.
  - By default, <span> has a display of inline.

  1. BLOCK:
    - Block display means the element will occupy the entire width of the web page by default.
    - You can set the width and height properties of a block element.
    - But no matter how small the width of a block element is, it will NOT bring up the next element to the same line.

  2. INLINE:
     - Inline display means the element's height and width will only be as big as the element's content.
     - Not possible to set the size of an inline element (height and width properties will not get applied).
     - Inline elements will all be displayed on the same line As Long As there is sufficient space left on that line for the next element.
  
  3. INLINE-BLOCK:
    - Inline-Block display allows us to set the height and width of elements, while retaining the inline behaiviour.
    - If you have an Inline-Block element followed by another Inline-Block or Inline element, then those two elements will be displayed on the same line.
      (Unless the width of the Inline-Block element is very large or fills the entire width of the webpage)
    - As long as there is sufficient space on the line, the next Inline/Inline-Block element will be displayed on the same line.
-->

<head>
  <title>CSS Display Property Example</title>
  <style>
    p {
      color: white;
    }

    .red {
      display: inline-block; /* goal 1 */
      display: block; /* goal 2 */
      width: 200px;
      height: 200px;
      background-color: red;
    }

    .green {
      display: inline-block; /* goal 1 */
      display: block; /* goal 2 */
      width: 200px;
      height: 200px;
      background-color: green;
    }

    .blue {
      display: inline-block; /* goal 1 */
      display: block; /* goal 2 */
      width: 200px;
      height: 200px;
      background-color: blue;
    }
  </style>
</head>


<body>
  <h1>CSS Display Property</h1>
  <p class="red">Red Paragraph </p>
  <p class="green">Green Paragraph</p>
  <p class="blue">Blue Paragraph</p>
</body>

</html>
